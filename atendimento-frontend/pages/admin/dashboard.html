<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Visão geral</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body class="app-body" data-page="admin-dashboard">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="app-main">
            <header class="topbar" id="topbar"></header>
            <main class="conteudo" id="conteudo" tabindex="-1">
                <div class="pagina-cabecalho">
                    <div>
                        <p class="sobretitulo" id="data-hoje"></p>
                        <h1>Visão geral</h1>
                        <p class="subtitulo">Indicadores consolidados de chamados, clientes e equipe.</p>
                    </div>
                    <div class="pagina-acoes">
                        <button type="button" class="btn btn-secundario" id="btn-atualizar"><span data-icone="atualizar"></span> Atualizar</button>
                        <a class="btn btn-primario" href="relatorios.html"><span data-icone="relatorio"></span> Relatório completo</a>
                    </div>
                </div>

                <section class="indicadores seis" id="indicadores" aria-label="Indicadores gerais"></section>

                <div class="grid">
                    <section class="card col-5" aria-labelledby="t-distribuicao">
                        <header class="card-cabecalho"><h2 id="t-distribuicao">Chamados por status</h2></header>
                        <div id="distribuicao"></div>
                    </section>

                    <section class="card col-7" aria-labelledby="t-urgentes">
                        <header class="card-cabecalho">
                            <h2 id="t-urgentes">Alta e crítica sem atendente</h2>
                            <a class="link-discreto" href="../atendente/chamados.html?visao=sem-atendente">Ver na fila</a>
                        </header>
                        <div id="urgentes"></div>
                    </section>

                    <section class="card col-12" aria-labelledby="t-recentes">
                        <header class="card-cabecalho">
                            <h2 id="t-recentes">Últimos chamados</h2>
                            <a class="link-discreto" href="../atendente/chamados.html">Ver todos</a>
                        </header>
                        <div id="recentes"></div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    <div class="toast-regiao" id="toasts" aria-live="polite"></div>
    <noscript><p class="alerta alerta-erro">Este sistema precisa de JavaScript habilitado.</p></noscript>
    <script type="module" src="../../assets/js/pages/admin.js"></script>
</body>
</html>
