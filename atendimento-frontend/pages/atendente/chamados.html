<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Fila de chamados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body class="app-body" data-page="fila-chamados">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="app-main">
            <header class="topbar" id="topbar"></header>
            <main class="conteudo" id="conteudo" tabindex="-1">
                <div class="pagina-cabecalho">
                    <div>
                        <h1>Fila de chamados</h1>
                        <p class="subtitulo">Todos os chamados registrados, do mais recente para o mais antigo.</p>
                    </div>
                    <div class="pagina-acoes">
                        <button type="button" class="btn btn-secundario" id="btn-atualizar"><span data-icone="atualizar"></span> Atualizar</button>
                        <button type="button" class="btn btn-primario" id="btn-novo"><span data-icone="mais"></span> Novo chamado</button>
                    </div>
                </div>

                <section class="card" aria-labelledby="t-fila">
                    <h2 class="sr-only" id="t-fila">Chamados</h2>
                    <div class="barra-visoes">
                        <div class="segmentado" role="group" aria-label="Visão da fila" id="visoes"></div>
                    </div>
                    <form class="filtros" id="filtros" role="search" aria-label="Filtrar chamados">
                    <div class="campo campo-busca">
                        <label class="campo-label" for="busca">Buscar</label>
                        <div class="campo-busca-wrap"><span data-icone="busca"></span><input class="input" id="busca" name="busca" type="search" autocomplete="off" placeholder="Protocolo, título, cliente ou atendente"></div>
                    </div>
                    <div class="campo campo-select">
                        <label class="campo-label" for="f-status">Status</label>
                        <select class="input" id="f-status" name="status"></select>
                    </div>
                    <div class="campo campo-select">
                        <label class="campo-label" for="f-prioridade">Prioridade</label>
                        <select class="input" id="f-prioridade" name="prioridade"></select>
                    </div>
                    <button type="reset" class="btn btn-fantasma">Limpar filtros</button>
                </form>
                    <p class="resumo-lista" id="resumo" aria-live="polite"></p>
                    <div id="lista"></div>
                </section>
            </main>
        </div>
    </div>
    <div class="toast-regiao" id="toasts" aria-live="polite"></div>
    <noscript><p class="alerta alerta-erro">Este sistema precisa de JavaScript habilitado.</p></noscript>
    <script type="module" src="../../assets/js/pages/atendente.js"></script>
</body>
</html>
