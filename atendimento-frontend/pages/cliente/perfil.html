<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Meu perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body class="app-body" data-page="cliente-perfil">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="app-main">
            <header class="topbar" id="topbar"></header>
            <main class="conteudo" id="conteudo" tabindex="-1">
                <div class="pagina-cabecalho">
                    <div>
                        <h1>Meu perfil</h1>
                        <p class="subtitulo">Dados do seu cadastro na central de atendimento.</p>
                    </div>
                </div>

                <div class="grid">
                    <section class="card col-7" aria-labelledby="t-dados">
                        <header class="card-cabecalho">
                            <h2 id="t-dados">Dados cadastrais</h2>
                            <span id="situacao"></span>
                        </header>
                        <div id="perfil"></div>
                    </section>

                    <aside class="col-5 pilha">
                        <section class="card card-nota" aria-labelledby="t-alterar">
                            <header class="card-cabecalho"><h2 id="t-alterar">Precisa atualizar algum dado?</h2></header>
                            <div class="card-corpo">
                                <p>A alteração de nome, e-mail ou telefone é feita pela administração. Abra um chamado informando o dado correto.</p>
                                <a class="btn btn-secundario" href="novo-chamado.html"><span data-icone="mais"></span> Abrir chamado</a>
                            </div>
                        </section>
                    </aside>
                </div>
            </main>
        </div>
    </div>
    <div class="toast-regiao" id="toasts" aria-live="polite"></div>
    <noscript><p class="alerta alerta-erro">Este sistema precisa de JavaScript habilitado.</p></noscript>
    <script type="module" src="../../assets/js/pages/cliente.js"></script>
</body>
</html>
